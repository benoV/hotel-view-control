<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hotel View Control</title>
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body>
    <main class="popup">
      <header><p class="eyebrow">LOCAL HOTEL PREFERENCES</p><h1>Hotel View Control</h1><p id="site-label">Open Booking.com or Agoda to manage hotels.</p></header>
      <section id="preferences" aria-live="polite"></section>
      <div class="actions">
        <button id="clear-site" class="secondary" hidden>Clear this site</button>
        <button id="clear-all" class="danger">Clear all saved hotels</button>
      </div>
      <footer>By <a href="https://hotelviewcontrol.kingtidemedia.com/" target="_blank" rel="noopener noreferrer">King Tide Media</a> · Preferences stay on this device.</footer>
    </main>
    <script src="popup/popup.js"></script>
  </body>
</html>
